name: deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend
        run: |
          npm --prefix web ci
          npm --prefix web run build

      # Refuse to reset prod's pre-render (#146).
      #
      # `engine/catalog.json` and `engine/catalog-approvals.json` are tracked in
      # git but written on the box — the first by prerender_catalog.py, the
      # second by the owner recording that they listened. The copy below would
      # put whatever this commit happens to carry over both, and a commit where
      # they are still empty resets prod to zero publishable programs. That
      # already happened once, and the deploy reported success.
      #
      # Staged to a scratch path first so the guard can compare the two BEFORE
      # anything lands in place. A check that ran after the copy would be
      # reporting on a file it had already destroyed.
      - name: Stage the files this deploy could destroy
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.host }}
          username: ${{ secrets.user }}
          key: ${{ secrets.ssh_key }}
          source: "engine/catalog.json,engine/catalog-approvals.json,deploy/check-catalog-state.sh"
          # NOT /tmp. This is a shared VPS (see DEPLOYMENT.md), and /tmp is
          # world-writable: a co-tenant who pre-creates a predictable staging
          # path owns it, and can swap the guard script between this step and
          # the next, symlink the directory at /srv so the staging copy becomes
          # the clobber, or chmod it so the cleanup fails and every deploy
          # after it dies. Under the app root only the deploy user can write.
          target: "/srv/hypnosis-studio/.deploy-staging/"

      - name: Refuse to clobber the pre-render or the listen record
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.host }}
          username: ${{ secrets.user }}
          key: ${{ secrets.ssh_key }}
          script: |
            set -e
            STAGED=/srv/hypnosis-studio/.deploy-staging
            LIVE=/srv/hypnosis-studio/engine
            # On every exit, not just the happy one: a refusal that left the
            # staged files behind would leave a stale copy for the next run to
            # compare against if the `source:` list above ever changes.
            trap 'rm -rf "$STAGED"' EXIT
            # Both, not just the manifest. The manifest can be rebuilt by
            # re-running the pre-render over masters that already exist; a
            # recorded listen cannot be regenerated by anything.
            bash "$STAGED/deploy/check-catalog-state.sh" \
              "$LIVE/catalog.json" "$STAGED/engine/catalog.json" catalog
            bash "$STAGED/deploy/check-catalog-state.sh" \
              "$LIVE/catalog-approvals.json" "$STAGED/engine/catalog-approvals.json" approvals

      - name: Copy app + engine to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.host }}
          username: ${{ secrets.user }}
          key: ${{ secrets.ssh_key }}
          source: "server.js,package.json,engine/**,web/dist/**,deploy/**"
          target: "/srv/hypnosis-studio/"

      - name: Restart service and smoke test
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.host }}
          username: ${{ secrets.user }}
          key: ${{ secrets.ssh_key }}
          command_timeout: 30m
          script: |
            set -e
            # Never restart mid-render: systemd kills the worker with the
            # service, destroying a render the customer paid for. Fails the
            # deploy rather than restarting if one is still running (#4).
            bash /srv/hypnosis-studio/deploy/wait-for-idle.sh http://127.0.0.1:4100/api/health

            # Cut any storefront sample this box is missing (#60). ffmpeg over
            # masters that already exist: no TTS, no key, no spend, and a no-op
            # once every publishable program has one — so it is safe on every
            # deploy rather than a step someone has to remember after a
            # pre-render.
            #
            # After the idle gate, so ffmpeg never competes with a live paid
            # render. Before the restart, because server.js indexes the samples
            # at boot. The script cannot fail the deploy by design; see the
            # header there and test/deploy.cut-samples.test.js.
            bash /srv/hypnosis-studio/deploy/cut-samples.sh \
              /srv/hypnosis-studio/engine /srv/hypnosis-studio/renders/catalog

            sudo /bin/systemctl restart hypnosis-studio
            sleep 2
            sudo /bin/systemctl is-active hypnosis-studio
            curl -sf -o /dev/null -w "smoke: HTTP %{http_code}\n" http://127.0.0.1:4100/
            curl -sf http://127.0.0.1:4100/api/health
            # Safe to gate on: the route answers 200 {"samples":[]} even when
            # nothing has been cut, so this fails only if it is actually broken.
            curl -sf http://127.0.0.1:4100/api/samples
