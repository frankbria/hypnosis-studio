name: deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend
        run: |
          npm --prefix web ci
          npm --prefix web run build

      - name: Copy app + engine to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.host }}
          username: ${{ secrets.user }}
          key: ${{ secrets.ssh_key }}
          source: "server.js,package.json,engine/**,web/dist/**,deploy/**"
          target: "/srv/hypnosis-studio/"

      - name: Restart service and smoke test
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.host }}
          username: ${{ secrets.user }}
          key: ${{ secrets.ssh_key }}
          command_timeout: 30m
          script: |
            set -e
            # Never restart mid-render: systemd kills the worker with the
            # service, destroying a render the customer paid for. Fails the
            # deploy rather than restarting if one is still running (#4).
            bash /srv/hypnosis-studio/deploy/wait-for-idle.sh http://127.0.0.1:4100/api/health
            sudo /bin/systemctl restart hypnosis-studio
            sleep 2
            sudo /bin/systemctl is-active hypnosis-studio
            curl -sf -o /dev/null -w "smoke: HTTP %{http_code}\n" http://127.0.0.1:4100/
            curl -sf http://127.0.0.1:4100/api/health
