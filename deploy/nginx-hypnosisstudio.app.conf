# nginx vhost for hypnosisstudio.app
#
# Install as /etc/nginx/sites-available/hypnosisstudio.app and symlink into
# sites-enabled. See DEPLOYMENT.md for the runbook.
#
# Committed rather than left as a remembered server edit, for the same reason
# ENVIRONMENT.md exists: the previous vhost lived only on the box, so nobody
# could review it or reconstruct it.
#
# SHARED SERVER. This file must only ever contain server blocks for
# hypnosisstudio.app. Other vhosts on this machine belong to other services.

# ---------------------------------------------------------------------------
# Port 80.
#
# `.app` is on the HSTS preload list — every browser ships with it hardcoded,
# so a browser rewrites http:// to https:// before it ever makes a request and
# this block is effectively unreachable from one. It still matters for two
# things: Let's Encrypt's HTTP-01 validation (which is not a browser and does
# not consult the preload list), and anything using curl or a bare HTTP client.
# ---------------------------------------------------------------------------
server {
    listen      80;
    listen      [::]:80;
    server_name hypnosisstudio.app;

    # Certbot writes challenge files here. Must be served over plain HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # `listen ... http2` is the nginx < 1.25.1 form, which is what prod runs
    # (1.24.0, Ubuntu). On 1.25.1+ this warns and wants a separate `http2 on;`
    # instead — check `nginx -v` before copying this onto a newer box.
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
    server_name hypnosisstudio.app;

    # Written by `certbot --nginx -d hypnosisstudio.app`. Left here so the file
    # is complete; certbot will rewrite these paths itself on first run.
    ssl_certificate     /etc/letsencrypt/live/hypnosisstudio.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hypnosisstudio.app/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # `.app` is preloaded regardless, but the header is what keeps it eligible
    # and what protects anyone on a browser that is not.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # The app serves the built bundle itself and does NOT compress. The main
    # chunk is ~330 KB uncompressed and ~99 KB gzipped, on the first paint of
    # every visit.
    gzip             on;
    gzip_proxied     any;
    gzip_min_length  1024;
    gzip_types       text/plain text/css application/javascript application/json
                     image/svg+xml application/manifest+json;
    # Deliberately NOT audio/mpeg or audio/wav: MP3 and WAV masters do not
    # compress, and gzipping them would spend CPU to make them bigger.

    # A mastered WAV is on the order of 100 MB. With proxy_buffering on, nginx
    # spools the whole response to disk before sending any of it — the customer
    # waits for the entire file to land on the server's disk first, and the box
    # takes the write. Off, it streams.
    proxy_buffering off;

    # A Stripe webhook is a few KB; the server's own reader caps at 64 KB and
    # nothing else accepts a body. 1 MB is already generous.
    client_max_body_size 1m;

    location / {
        proxy_pass       http://127.0.0.1:4100;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # POST /api/checkout waits on Stripe with a 10 s timeout of its own, so
        # 60 s is slack rather than a ceiling anything real reaches. Renders are
        # asynchronous — no request ever waits on one.
        proxy_read_timeout 60s;

        # The webhook signature is computed over the RAW body. nginx passes the
        # body through byte-for-byte and nothing here rewrites it; do not add
        # anything that would (sub_filter, a body-modifying module).
    }
}
